[project]
name = "qa-gen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "supabase>=2.0",
    "voyageai>=0.3",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "gherkin-official>=29.0",
    "psycopg2-binary>=2.9",
    # optional: sentence-transformers>=2.7,<3 for local semantic search (US1–US4)
    # pip install "sentence-transformers>=2.7,<3"
]

[project.scripts]
qa-gen = "qa_gen.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["qa_gen"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
